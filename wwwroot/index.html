<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NevApps</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <!--<link rel="stylesheet" href="NevApps.styles.css" />-->
    <link rel="icon" href="data:,">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <style>
        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            height: 100vh;
            height: 100dvh;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
            box-sizing: border-box;
            background:
                radial-gradient(circle at 50% 38%, #efeaff 0%, #f7f6fb 42%, #ffffff 72%);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .loading-mark {
            position: relative;
            width: 112px;
            height: 112px;
            display: grid;
            place-items: center;
        }

        .loading-mark img {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            animation: loading-breathe 2.4s ease-in-out infinite;
        }

        .loading-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(89, 74, 226, 0.16);
            border-top-color: #594ae2;
            animation: loading-spin 0.9s linear infinite;
        }

        .loading-title {
            margin: 4px 0 0;
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: 0.4px;
            color: #2a2440;
        }

        .loading-text {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 500;
            color: #6b657a;
            letter-spacing: 0.2px;
        }

        .loading-ellipsis {
            display: inline-block;
            width: 1.15em;
            text-align: left;
        }

        .loading-ellipsis span {
            opacity: 0.25;
            animation: loading-dots 1.2s infinite both;
        }

        .loading-ellipsis span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-ellipsis span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .loading-bar {
            width: 132px;
            height: 3px;
            border-radius: 99px;
            overflow: hidden;
            background-color: rgba(89, 74, 226, 0.16);
            background-image: linear-gradient(90deg,
                rgba(89, 74, 226, 0.2) 0%,
                #594ae2 25%,
                rgba(89, 74, 226, 0.2) 50%,
                #594ae2 75%,
                rgba(89, 74, 226, 0.2) 100%);
            background-size: 200% 100%;
            background-repeat: repeat;
            animation: loading-slide 0.9s linear infinite;
        }

        @keyframes loading-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes loading-breathe {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        @keyframes loading-dots {
            0%, 80%, 100% {
                opacity: 0.25;
            }
            40% {
                opacity: 1;
            }
        }

        @keyframes loading-slide {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 200% 0;
            }
        }

        @media (prefers-color-scheme: dark) {
            .loading-container {
                background:
                    radial-gradient(circle at 50% 38%, #2a2448 0%, #16141f 46%, #121212 74%);
            }

            .loading-title {
                color: #f3f0ff;
            }

            .loading-text {
                color: #bdb7cc;
            }

            .loading-ring {
                border-color: rgba(177, 166, 255, 0.18);
                border-top-color: #b1a6ff;
            }

            .loading-bar {
                background-color: rgba(177, 166, 255, 0.18);
                background-image: linear-gradient(90deg,
                    rgba(177, 166, 255, 0.25) 0%,
                    #b1a6ff 25%,
                    rgba(177, 166, 255, 0.25) 50%,
                    #b1a6ff 75%,
                    rgba(177, 166, 255, 0.25) 100%);
            }
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-container">
            <div class="loading-mark">
                <div class="loading-ring"></div>
                <img alt="NevApps"
                     src="images/logo.png"/>
            </div>
            <p class="loading-title">NevApps</p>
            <p class="loading-text">Initializing components<span class="loading-ellipsis"><span>.</span><span>.</span><span>.</span></span></p>
<!--        <div class="loading-bar" aria-hidden="true"><span></span></div>-->
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        (function () {
            var ua = navigator.userAgent || "";
            var ios = /iP(hone|ad|od)/.test(ua)
                || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
            var android = /Android/i.test(ua);
            if (android) document.documentElement.classList.add("app-android");
            if (!ios) return;
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
                meta.setAttribute("content",
                    meta.getAttribute("content") + ", interactive-widget=resizes-content");
            }
            if (!window.visualViewport) return;
            var pin = function () { window.scrollTo(0, 0); };
            visualViewport.addEventListener("scroll", pin);
            visualViewport.addEventListener("resize", pin);
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/section-swipe.js"></script>

</body>

</html>
